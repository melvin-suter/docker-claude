name: Docker Image

on:
  schedule:
    - cron: "0 10 * * *" # everyday at 10am
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin the Claude Code version so the build cache is reused until a new release
      - name: Resolve latest Claude Code version
        id: claude
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/claude

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          build-args: CLAUDE_CODE_VERSION=${{ steps.claude.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the GitHub Actions cache. The nightly run skips reading
          # it so the base image and apt packages get security updates daily.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
